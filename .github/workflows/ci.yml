name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    
    # Services required for tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git history operations

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies and run tests for social-listening-core
      - name: Install core dependencies
        working-directory: social-listening-core
        run: npm ci

      - name: Run type check
        working-directory: social-listening-core
        run: npm run typecheck

      - name: Run lint
        working-directory: social-listening-core
        run: npx eslint . --ext .ts || true  # Non-blocking for now

      - name: Run tests
        working-directory: social-listening-core
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: testuser
          PGPASSWORD: testpassword
          PGDATABASE: testdb
          # Azure emulator credentials for local testing
          AZURE_KEYVAULT_ENDPOINT: http://localhost:4100
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
          AZURE_CLIENT_SECRET: test-secret
        run: npm test

      # Install dependencies and run tests for social-listening-admin
      - name: Install admin dependencies
        working-directory: social-listening-admin
        run: npm ci

      - name: Run type check (admin)
        working-directory: social-listening-admin
        run: npm run typecheck || true

      - name: Run lint (admin)
        working-directory: social-listening-admin
        run: npx eslint . --ext .ts --ext .jsx || true

      - name: Run tests (admin)
        working-directory: social-listening-admin
        run: npm test || true  # Admin tests may not exist yet

  # Separate job for implementation log verification
  verify-implementation-log:
    name: Verify Implementation Log
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify implementation log
        working-directory: .
        run: |
          # Copy the check script to a temporary location
          cp docs/templates/check-implementation-log.cjs /tmp/check-impl-log.cjs
          # Run the check - this will fail if there are discrepancies
          node /tmp/check-impl-log.cjs || {
            echo "::error::Implementation log verification failed"
            exit 1
          }
          echo "Implementation log verification passed"

  # Job for traceability verification
  verify-traceability:
    name: Verify Traceability
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify ADR traceability
        run: |
          # Check that every ADR referenced in implementation-plan.md exists
          # and has Accepted status
          node -e "
            const fs = require('fs');
            const implPlan = fs.readFileSync('docs/implementation-plan.md', 'utf8');
            
            // Extract ADR numbers from the plan
            const adrMatches = implPlan.match(/ADR-\d+/g) || [];
            const adrNumbers = [...new Set(adrMatches)].map(m => m.replace('ADR-', ''));
            
            let errors = [];
            for (const num of adrNumbers) {
              const adrPath = \`docs/adr/\${num.padStart(4, '0')}-*.md\`;
              const files = fs.readdirSync('docs/adr/').filter(f => f.match(new RegExp(\`^\${num.padStart(4, '0')}-.*\\.md\$\`)));
              if (files.length === 0) {
                errors.push(\`ADR-\${num} referenced but not found\`);
              } else {
                const content = fs.readFileSync(\`docs/adr/\${files[0]}\`, 'utf8');
                if (!content.includes('Status: Accepted') && !content.includes('Accepted:')) {
                  errors.push(\`ADR-\${num} exists but is not Accepted\`);
                }
              }
            }
            
            if (errors.length > 0) {
              console.error('Traceability errors found:');
              errors.forEach(e => console.error('  -', e));
              process.exit(1);
            }
            console.log('ADR traceability verification passed');
          " || true

      - name: Verify story traceability
        run: |
          # Check that stories referenced in implementation-plan.md have corresponding contracts
          node -e "
            const fs = require('fs');
            const implPlan = fs.readFileSync('docs/implementation-plan.md', 'utf8');
            
            // Extract story numbers
            const storyMatches = implPlan.match(/Story \d+\.\d+/g) || [];
            const storyNumbers = [...new Set(storyMatches)].map(s => s.replace('Story ', ''));
            
            let missing = [];
            for (const storyNum of storyNumbers) {
              const epic = storyNum.split('.')[0];
              const story = storyNum.split('.')[1];
              const contractPattern = new RegExp(\`contracts/epic-\${epic}/story-\${storyNum}\\.\*.contract\\.test\\.ts\`);
              
              try {
                const contracts = require('glob').sync('social-listening-core/contracts/epic-*/story-*.contract.test.ts');
                const match = contracts.find(c => c.includes(storyNum));
                if (!match) {
                  missing.push(storyNum);
                }
              } catch (e) {
                // glob not available, skip this check
                console.log('Skipping contract existence check (glob not available)');
              }
            }
            
            if (missing.length > 0) {
              console.error('Missing contracts for stories:', missing.join(', '));
              process.exit(1);
            }
            console.log('Story traceability verification passed');
          " || true

  # Job for generating project health report
  generate-health-report:
    name: Generate Health Report
    runs-on: ubuntu-latest
    needs: [test, verify-implementation-log, verify-traceability]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate health report
        run: |
          # Create a health report markdown file
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const report = [];
            report.push('# Project Health Report');
            report.push('');
            report.push(\`**Generated:** \${new Date().toISOString()}\`);
            report.push('');
            
            // Count implementation log entries
            try {
              const implLog = fs.readFileSync('docs/implementation-log.md', 'utf8');
              const entries = (implLog.match(/^## \d{4}-\d{2}-\d{2}/gm) || []).length;
              report.push(\`## Progress\`);
              report.push(\`\`\`markdown\`);
              report.push(\`| Metric | Value |\`);
              report.push(\`|--------|-------|\`);
              report.push(\`| Implementation Log Entries | \${entries} |\`);
              report.push(\`\`\`\`);
            } catch (e) {
              report.push('## Progress: Unable to read implementation log');
            }
            
            // Try to run test count
            try {
              const testOutput = execSync('cd social-listening-core && npm test -- --silent 2>&1 || true', { encoding: 'utf8' });
              const passMatch = testOutput.match(/Tests:\s+(\d+)\s+passed/);
              const totalMatch = testOutput.match(/Tests:\s+\d+\s+passed,\s+(\d+)\s+total/);
              if (passMatch && totalMatch) {
                report.push('');
                report.push(\`| Test Results | \${passMatch[1]}/\${totalMatch[1]} passed |\`);
              }
            } catch (e) {
              // Tests may fail, that's okay
            }
            
            // Add git status
            try {
              const gitStatus = execSync('git log --oneline -1', { encoding: 'utf8' }).trim();
              report.push('');
              report.push(\`## Git Status\`);
              report.push(\`\`\`\`);
              report.push(\`Latest commit: \${gitStatus}\`);
              report.push(\`\`\`\`);
            } catch (e) {
              // Git may not be available
            }
            
            fs.writeFileSync('project-health-report.md', report.join('\\n'));
            console.log('Health report generated: project-health-report.md');
          " || true

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: project-health-report
          path: project-health-report.md
          retention-days: 7
